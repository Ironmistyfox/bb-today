# Compila BB Today para Windows y Mac, la prueba y la publica.
#
# - Al subir una etiqueta vX.Y.Z (npm run publicar la crea): compila, prueba
#   y crea el release del que se actualizan las apps instaladas.
# - A mano: compila y prueba; con etiqueta existente, publica esa etiqueta.
#
# Cada sistema pasa una prueba de humo con datos de ejemplo
# (tools/probar-paquete.mjs): capturas del widget, la vista previa y
# Configuración, y la vista previa recorrida con un ratón simulado. Las
# capturas quedan como artefactos del run ("pruebas-windows", "pruebas-mac").
#
# Windows se firma con SignPath si está configurado (secreto
# SIGNPATH_API_TOKEN y variable SIGNPATH_ORGANIZATION_ID; ver docs/FIRMA.md).
# Mac va con firma ad hoc: sin cuenta de desarrollador de Apple no se puede
# notarizar, y la app sólo avisa de las versiones nuevas.

name: Publicar

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      etiqueta:
        description: 'Etiqueta existente que publicar; vacío sólo compila la referencia elegida'
        type: string
        default: ''
      equipo_windows:
        description: 'Equipo Windows para evitar una cola saturada'
        type: choice
        default: windows-2022
        options: [windows-latest, windows-2022]
      equipo_mac:
        description: 'Equipo Mac Apple Silicon para evitar una cola saturada'
        type: choice
        default: macos-14
        options: [macos-latest, macos-15, macos-14]

permissions:
  contents: write

# Una sola ejecución a la vez por etiqueta.
concurrency:
  group: publicar-${{ inputs.etiqueta && format('refs/tags/{0}', inputs.etiqueta) || github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: ${{ inputs.equipo_windows || 'windows-2022' }}
    env:
      FIRMAR: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.etiqueta || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # El servidor MCP de «Resolver con Claude» viaja como bundle, que no se versiona.
      - name: Empaquetar el servidor MCP
        run: node tools/empaquetar-mcp.mjs

      - name: Compilar el instalador
        # bash: PowerShell parte el argumento "-c.directories.output" por el punto.
        shell: bash
        run: npx electron-builder --win --publish never -c.directories.output=dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Prueba de humo
        shell: bash
        run: node tools/probar-paquete.mjs "dist/win-unpacked/BB Today.exe" pruebas

      - name: Prueba del servidor MCP
        shell: bash
        run: node tools/probar-mcp.mjs "dist/win-unpacked/BB Today.exe"

      - name: Prueba de interacción con tareas
        shell: bash
        run: node tools/probar-interacciones.mjs "dist/win-unpacked/BB Today.exe"

      - name: Guardar las capturas de la prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-windows
          path: pruebas
          if-no-files-found: ignore

      - name: Guardar el instalador sin firmar
        id: sin-firmar
        uses: actions/upload-artifact@v4
        with:
          name: instalador-sin-firmar
          path: dist/BB-Today-Setup.exe
          if-no-files-found: error

      - name: Firmar con SignPath
        if: env.FIRMAR == 'true' && (startsWith(github.ref, 'refs/tags/') || inputs.etiqueta != '')
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: bb-today
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.sin-firmar.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: firmado

      - name: Usar el instalador firmado
        if: env.FIRMAR == 'true' && (startsWith(github.ref, 'refs/tags/') || inputs.etiqueta != '')
        shell: bash
        run: cp firmado/BB-Today-Setup.exe dist/BB-Today-Setup.exe

      - name: Recalcular latest.yml y blockmap
        run: node tools/finalizar-instalador.mjs dist

      - name: Guardar los archivos de Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/BB-Today-Setup.exe
            dist/BB-Today-Setup.exe.blockmap
            dist/BB-Today-Instalador.exe
            dist/latest.yml
          if-no-files-found: error

  mac:
    runs-on: ${{ inputs.equipo_mac || 'macos-14' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.etiqueta || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # npm sólo instala el binario de koffi de esta máquina (Apple Silicon);
      # la versión para Intel necesita también el suyo.
      - name: Binario de koffi para Mac Intel
        run: npm install --no-save --force @koromix/koffi-darwin-x64@$(node -p "require('koffi/package.json').version")

      # El servidor MCP de «Resolver con Claude» viaja como bundle, que no se versiona.
      - name: Empaquetar el servidor MCP
        run: node tools/empaquetar-mcp.mjs

      - name: Compilar para Mac
        run: npx electron-builder --mac --publish never -c.directories.output=dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Prueba de humo
        run: node tools/probar-paquete.mjs "dist/mac-arm64/BB Today.app/Contents/MacOS/BB Today" pruebas

      - name: Prueba del servidor MCP
        run: node tools/probar-mcp.mjs "dist/mac-arm64/BB Today.app/Contents/MacOS/BB Today"

      - name: Prueba de interacción con tareas
        run: node tools/probar-interacciones.mjs "dist/mac-arm64/BB Today.app/Contents/MacOS/BB Today"

      - name: Guardar las capturas de la prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-mac
          path: pruebas
          if-no-files-found: ignore

      - name: Guardar los archivos de Mac
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/BB-Today-Mac-*.dmg
            dist/BB-Today-Mac-*.zip
            dist/BB-Today-Mac-*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  publicar:
    if: startsWith(github.ref, 'refs/tags/') || inputs.etiqueta != ''
    needs: [windows, mac]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.etiqueta || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: archivos/windows

      - uses: actions/download-artifact@v4
        with:
          name: mac
          path: archivos/mac

      - name: Comprobar que la etiqueta es la versión de package.json
        env:
          ETIQUETA: ${{ inputs.etiqueta || github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          [[ "$ETIQUETA" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Se requiere una etiqueta estable vX.Y.Z"; exit 1; }
          [ "v$version" = "$ETIQUETA" ] || { echo "La etiqueta $ETIQUETA no coincide con la versión $version"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$(git rev-parse "$ETIQUETA^{commit}")" ] || { echo "El código no coincide con la etiqueta"; exit 1; }
          node tools/notas-version.mjs "$version" notas.md

      - name: Crear el release
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ inputs.etiqueta || github.ref_name }}
        run: |
          ls -la archivos/*
          version=${ETIQUETA#v}
          # GitHub a veces lanza dos ejecuciones para la misma etiqueta: si el
          # release ya existe, se suben los archivos encima en vez de fallar.
          if gh release view "$ETIQUETA" >/dev/null 2>&1; then
            gh release upload "$ETIQUETA" archivos/windows/* archivos/mac/* --clobber
          else
            gh release create "$ETIQUETA" archivos/windows/* archivos/mac/* \
              --title "BB Today $version" --notes-file notas.md --latest
          fi
