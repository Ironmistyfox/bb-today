<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vista previa</title>
<link rel="stylesheet" href="temas.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  html, body { height: 100%; }
  body {
    color: var(--texto);
    font: 12.5px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* La ventana ocupa todo el alto y no cambia de tamaño: la tarjeta se mueve
     dentro (translateY) hasta la altura de la fila. */
  .tarjeta {
    position: absolute;
    top: 0;
    left: 14px;
    right: 14px;
    max-height: min(640px, calc(100vh - 28px));
    overflow-y: auto;
    /* La vista previa va casi opaca aunque el widget sea translúcido: es
       para leer. */
    background: color-mix(in srgb, var(--fondo-a) calc(max(var(--alfa-tema, 1), .9) * 97%), transparent);
    border: 1px solid var(--borde);
    border-radius: 14px;
    box-shadow: var(--sombra);
    scrollbar-width: none;
    opacity: 0;
    pointer-events: none;
    transform: translateY(var(--y, 0px)) translateX(6px);
    transition: opacity .13s ease-out, transform .18s cubic-bezier(.2, .8, .2, 1);
    will-change: transform, opacity;
  }
  .tarjeta.visible { opacity: 1; pointer-events: auto; transform: translateY(var(--y, 0px)); }
  .tarjeta.quieta { transition: opacity .13s ease-out; }
  /* Al cambiar de tarea, el contenido nuevo entra con un fundido corto. */
  .contenido { transition: opacity .12s ease-out; }
  .contenido.entrando { opacity: .25; transition: none; }
  .franja { height: 3px; }
  .cuerpo { padding: 12px 14px 12px; }
  .curso { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
  h2 { margin: 3px 0 8px; font: 600 15px/1.25 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .chip { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 2px 9px; background: var(--pieza); color: var(--suave); }
  .chip.mal { color: var(--mal); background: color-mix(in srgb, var(--mal) 14%, transparent); }
  .chip.pronto { color: var(--pronto); background: color-mix(in srgb, var(--pronto) 14%, transparent); }
  .chip.bien { color: var(--bien); background: color-mix(in srgb, var(--bien) 13%, transparent); }

  .seccion { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--tenue); margin: 12px 0 6px; }
  .instrucciones { white-space: pre-line; color: var(--suave); max-height: 190px; overflow-y: auto; scrollbar-width: thin; user-select: text; }
  .vacio { color: var(--tenue); font-style: italic; }

  .archivos { display: flex; flex-direction: column; gap: 8px; }
  .archivo { display: block; border-radius: 10px; background: var(--pieza); overflow: hidden; cursor: pointer; border: 1px solid transparent; transition: background .12s, border-color .12s; }
  .archivo:hover { background: var(--pieza-hover); border-color: var(--borde); }
  .muestra { position: relative; border-bottom: 1px solid var(--linea); }
  .muestra img, .muestra canvas { display: block; width: 100%; max-height: 118px; object-fit: cover; object-position: top; background: #fff; }
  .muestra pre { margin: 0; padding: 8px 10px; font: 11px/1.5 "Cascadia Mono", Consolas, monospace; background: var(--codigo); color: var(--suave); white-space: pre; overflow: hidden; max-height: 170px; }
  .muestra .zip { padding: 7px 10px; font: 11px/1.6 "Cascadia Mono", Consolas, monospace; color: var(--suave); background: var(--codigo); }
  .muestra .zip span { color: var(--tenue); }
  .muestra .texto { padding: 8px 10px; color: var(--suave); font-size: 11.5px; white-space: pre-line; max-height: 110px; overflow: hidden; background: var(--codigo); -webkit-mask-image: linear-gradient(#000 70%, transparent); }
  .esqueleto { height: 72px; background: linear-gradient(90deg, var(--pieza) 25%, var(--pieza-hover) 50%, var(--pieza) 75%); background-size: 200% 100%; animation: brillo 1.2s linear infinite; }
  @keyframes brillo { to { background-position: -200% 0; } }
  .fila { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 10px; }
  .tipo { font-size: 9.5px; font-weight: 700; letter-spacing: .04em; padding: 2px 5px; border-radius: 4px; color: #fff; }
  .nombre { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .origen { font-size: 10.5px; color: var(--tenue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bajar { color: var(--tenue); display: flex; align-items: center; gap: 4px; font-size: 11px; white-space: nowrap; }
  .archivo:hover .bajar { color: var(--texto); }
  .bajar svg { width: 13px; height: 13px; }

  .fotos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .foto { aspect-ratio: 16 / 10; border-radius: 8px; overflow: hidden; background: var(--pieza); cursor: pointer; border: 1px solid transparent; }
  .foto:hover { border-color: var(--borde); }
  .foto img { width: 100%; height: 100%; object-fit: contain; display: block; background: var(--codigo); }

  .pie { border-top: 1px solid var(--linea); padding: 9px 14px; display: flex; justify-content: space-between; align-items: center; }
  .abrir { font: inherit; font-size: 12px; font-weight: 600; color: var(--texto); background: var(--pieza); border: 0; border-radius: 7px; padding: 5px 10px; cursor: pointer; }
  .abrir:hover { background: var(--pieza-hover); }
  .ruta { font-size: 10.5px; color: var(--tenue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 8px; }
  .cargando-linea { height: 10px; border-radius: 5px; margin: 6px 0; }
  .esqueleto.alto-pdf { height: 118px; }
  .muestra canvas { height: 118px; object-fit: cover; }
</style>
</head>
<body>
<div class="tarjeta" id="tarjeta"><div class="contenido" id="contenido"></div></div>

<script type="module">
import * as pdfjs from '../node_modules/pdfjs-dist/build/pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = new URL('../node_modules/pdfjs-dist/build/pdf.worker.min.mjs', import.meta.url).href;

const vista = window.agenda.vista;
const $tarjeta = document.getElementById('tarjeta');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const DIA = 86_400_000;
const inicioDia = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const fmtHora = new Intl.DateTimeFormat('es-MX', { hour: 'numeric', minute: '2-digit' });
const fmtDia = new Intl.DateTimeFormat('es-MX', { weekday: 'long', day: 'numeric', month: 'short' });

const TIPOS = {
  pdf: ['PDF', '#d9473b'], doc: ['DOC', '#2f6fd6'], docx: ['DOCX', '#2f6fd6'], ppt: ['PPT', '#d0691e'], pptx: ['PPTX', '#d0691e'],
  xls: ['XLS', '#1f8a4c'], xlsx: ['XLSX', '#1f8a4c'], zip: ['ZIP', '#6b6760'], rar: ['RAR', '#6b6760'],
  png: ['IMG', '#8f5bd6'], jpg: ['IMG', '#8f5bd6'], jpeg: ['IMG', '#8f5bd6'], gif: ['IMG', '#8f5bd6'], webp: ['IMG', '#8f5bd6'],
  mp4: ['VID', '#c2417a'], mp3: ['AUD', '#c2417a'],
};
function tipoDe(nombre) {
  const ext = (String(nombre).split('.').pop() || '').toLowerCase();
  return TIPOS[ext] || [ext.slice(0, 4).toUpperCase() || 'ARCH', '#5d6b82'];
}
const esFoto = (a) => /\.(png|jpe?g|gif|webp|bmp)$/i.test(a.nombre || '') || /^image\//.test(a.mime || '');
const previsualizable = (a) => esFoto(a) || /\.(pdf|zip|docx|pptx|txt|c|cc|cpp|h|hpp|py|java|js|ts|cs|md|csv|json|sql|html|css)$/i.test(a.nombre || '');

function tamano(b) {
  if (!b) return '';
  if (b < 1024) return `${b} B`;
  if (b < 1024 * 1024) return `${Math.round(b / 1024)} KB`;
  return `${(b / 1024 / 1024).toFixed(1)} MB`;
}

function chipsEntrega(t) {
  if (!t.entrega) return '<div class="chips"><span class="chip">Sin fecha de entrega</span></div>';
  const cuando = Date.parse(t.entrega);
  const ms = cuando - Date.now();
  const dias = Math.round((inicioDia(Date.now()) - inicioDia(cuando)) / DIA);
  let chips = '';
  if (ms >= 0) {
    const h = Math.floor(ms / 3_600_000);
    const dias = Math.round((inicioDia(cuando) - inicioDia(Date.now())) / DIA);
    const falta = h < 1 ? `${Math.max(1, Math.round(ms / 60_000))} min` : h < 24 ? `${h} h` : dias <= 1 ? `${h} h` : `${dias} días`;
    const hoy = inicioDia(cuando) === inicioDia(Date.now());
    chips += `<span class="chip ${h < 3 ? 'mal' : 'pronto'}">${hoy ? 'Hoy' : fmtDia.format(cuando)} · ${fmtHora.format(cuando)} · faltan ${falta}</span>`;
  } else {
    chips += `<span class="chip mal">Venció ${dias <= 0 ? `hoy a las ${fmtHora.format(cuando)}` : dias === 1 ? 'ayer' : `hace ${dias} días`}</span>`;
  }
  if (ms < 0 && t.tardia) chips += '<span class="chip bien">Acepta entrega tardía</span>';
  return `<div class="chips">${chips}</div>`;
}

let actual = null;
const $contenido = document.getElementById('contenido');
let esperaPrimera = null;

// ---- Pintado ----

function pintar() {
  const { tarea, curso, color, cargando, detalle, error } = actual;
  let html = `<div class="franja" style="background:${color}"></div><div class="cuerpo">
    <div class="curso" style="color:${color}">${esc(curso)}</div>
    <h2>${esc(tarea.titulo)}</h2>
    ${chipsEntrega(tarea)}`;

  const instrucciones = detalle?.instrucciones ?? tarea.instrucciones;
  if (cargando && !instrucciones) {
    html += `<div class="seccion">Instrucciones</div><div class="esqueleto cargando-linea" style="width:92%"></div><div class="esqueleto cargando-linea" style="width:70%"></div>`;
  } else if (instrucciones) {
    html += `<div class="seccion">Instrucciones</div><div class="instrucciones">${esc(instrucciones)}</div>`;
  }

  const archivos = detalle?.archivos || [];
  if (archivos.length) {
    const fotos = archivos.map((a, i) => ({ a, i })).filter(({ a }) => esFoto(a));
    const otros = archivos.map((a, i) => ({ a, i })).filter(({ a }) => !esFoto(a));
    html += `<div class="seccion">Archivos · ${archivos.length}</div>`;
    if (fotos.length) {
      html += `<div class="fotos">${fotos.map(({ a, i }) => `<div class="foto" data-archivo="${i}" title="${esc(a.nombre)} · clic para abrir">${contenidoFoto(a)}</div>`).join('')}</div>`;
      if (otros.length) html += '<div style="height:8px"></div>';
    }
    html += `<div class="archivos">${otros.map(({ a, i }) => tarjetaArchivo(a, i)).join('')}</div>`;
  } else if (!cargando && !instrucciones) {
    html += `<div class="seccion">Detalle</div><div class="vacio">${error ? 'No se pudo leer el detalle de Blackboard.' : 'Sin instrucciones ni archivos en Blackboard.'}</div>`;
  }

  const ruta = (tarea.ruta || []).join(' › ');
  html += `</div><div class="pie"><span class="ruta" title="${esc(ruta)}">${esc(ruta)}</span><button class="abrir" data-url="${esc(tarea.enlace)}">Abrir en Blackboard ↗</button></div>`;
  $contenido.innerHTML = html;
  for (const lienzo of $contenido.querySelectorAll('canvas[data-pdf]')) dibujarPdf(lienzo, Number(lienzo.dataset.pdf));
}

const contenidoFoto = (a) => (a.muestra?.src ? `<img src="${a.muestra.src}" alt="">` : '<div class="esqueleto" style="height:100%"></div>');

function htmlMuestra(a, i) {
  const m = a.muestra;
  if (m?.tipo === 'pdf') return `<canvas data-pdf="${i}"></canvas>`;
  if (m?.tipo === 'zip') return `<div class="zip">${m.archivos.map((n) => {
    const partes = n.split('/');
    const base = partes.pop();
    return `<div>${partes.length ? `<span>${esc(partes.join('/'))}/</span>` : ''}${esc(base)}</div>`;
  }).join('')}${m.resto ? `<div><span>y ${m.resto} más…</span></div>` : ''}</div>`;
  if (m?.tipo === 'codigo') return `<pre>${esc(m.lineas.join('\n'))}${m.resto ? `\n<span style="opacity:.6">… ${m.resto} líneas más</span>` : ''}</pre>`;
  if (m?.tipo === 'texto') return `<div class="texto">${m.nota ? `<b>${esc(m.nota)}</b>\n` : ''}${esc(m.texto)}</div>`;
  if (!m && !a.sinMuestra && previsualizable(a)) return `<div class="esqueleto${/\.pdf$/i.test(a.nombre || '') ? ' alto-pdf' : ''}"></div>`;
  return '';
}

const htmlOrigen = (a) => esc([tamano(a.bytes || a.muestra?.bytes), a.origen].filter(Boolean).join(' · '));

const ICONO_BAJAR = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v8M4.5 7.5 8 11l3.5-3.5M3 13.5h10"/></svg>';
const htmlBajar = (a) => `${a.estadoDescarga ? `<span>${esc(a.estadoDescarga)}</span>` : ''}${ICONO_BAJAR}`;

function tarjetaArchivo(a, i) {
  const [etiqueta, color] = tipoDe(a.nombre);
  const muestra = htmlMuestra(a, i);
  return `<div class="archivo" data-archivo="${i}" title="Clic para abrir ${esc(a.nombre)}">
    ${muestra ? `<div class="muestra">${muestra}</div>` : ''}
    <div class="fila">
      <span class="tipo" style="background:${color}">${etiqueta}</span>
      <div style="min-width:0"><div class="nombre">${esc(a.nombre)}</div><div class="origen">${htmlOrigen(a)}</div></div>
      <span class="bajar">${htmlBajar(a)}</span>
    </div></div>`;
}

// Cuando llega la muestra de un archivo sólo se toca su casilla: rehacer la
// tarjeta entera volvía a dibujar los PDF y hacía parpadear todo.
function actualizarArchivo(i) {
  const a = actual.detalle.archivos[i];
  const el = $contenido.querySelector(`[data-archivo="${i}"]`);
  if (!el) return;
  if (el.classList.contains('foto')) {
    el.innerHTML = contenidoFoto(a);
    return;
  }
  const html = htmlMuestra(a, i);
  let caja = el.querySelector('.muestra');
  if (!html) {
    caja?.remove();
  } else {
    if (!caja) {
      caja = document.createElement('div');
      caja.className = 'muestra';
      el.prepend(caja);
    }
    caja.innerHTML = html;
    const lienzo = caja.querySelector('canvas[data-pdf]');
    if (lienzo) dibujarPdf(lienzo, i);
  }
  el.querySelector('.origen').innerHTML = htmlOrigen(a);
}

const pdfs = new Map();
async function dibujarPdf(lienzo, i) {
  const n = actual.n;
  const archivo = actual.detalle.archivos[i];
  try {
    let pagina = pdfs.get(archivo.url);
    if (!pagina) {
      const bytes = Uint8Array.from(atob(archivo.muestra.datos), (c) => c.charCodeAt(0));
      const doc = await pdfjs.getDocument({ data: bytes }).promise;
      pagina = await doc.getPage(1);
      pdfs.set(archivo.url, pagina);
    }
    if (!actual || n !== actual.n || !lienzo.isConnected) return;
    const base = pagina.getViewport({ scale: 1 });
    const escala = (330 * devicePixelRatio) / base.width; // nítido en pantallas con escala
    const viewport = pagina.getViewport({ scale: escala });
    // Se dibuja fuera de pantalla y se copia de golpe: sin franjas a medio pintar.
    const fuera = document.createElement('canvas');
    fuera.width = viewport.width;
    fuera.height = Math.min(viewport.height, 118 * (viewport.width / 330));
    await pagina.render({ canvasContext: fuera.getContext('2d'), viewport }).promise;
    if (!actual || n !== actual.n || !lienzo.isConnected) return;
    lienzo.width = fuera.width;
    lienzo.height = fuera.height;
    lienzo.getContext('2d').drawImage(fuera, 0, 0);
  } catch {
    lienzo.closest('.muestra')?.remove();
  }
}

// ---- Posición y visibilidad ----

// La tarjeta se coloca a la altura de la fila, sin salirse de la pantalla.
function colocar({ animar }) {
  if (!actual) return;
  const alto = $tarjeta.offsetHeight;
  const y = Math.round(Math.max(8, Math.min(actual.ancla - 6, innerHeight - alto - 8)));
  $tarjeta.classList.toggle('quieta', !animar);
  $tarjeta.style.setProperty('--y', `${y}px`);
  vista.tarjeta({ x: $tarjeta.offsetLeft, y, width: $tarjeta.offsetWidth, height: alto });
}

function mostrarTarjeta() {
  clearTimeout(esperaPrimera);
  if (!actual || $tarjeta.classList.contains('visible')) return;
  colocar({ animar: false });
  // (setTimeout y no requestAnimationFrame: éste se detiene si Windows da la
  // ventana por tapada, y la tarjeta no llegaba a mostrarse.)
  setTimeout(() => $tarjeta.classList.add('visible'), 16);
}

new ResizeObserver(() => {
  if ($tarjeta.classList.contains('visible')) colocar({ animar: true });
}).observe($tarjeta);

const oscuroSistema = matchMedia('(prefers-color-scheme: dark)');
function aplicarTema(p) {
  const tema = !p?.tema || p.tema === 'sistema' ? (oscuroSistema.matches ? 'medianoche' : 'claro') : p.tema;
  document.documentElement.dataset.tema = tema;
}

vista.alDatos((datos) => {
  aplicarTema(datos.prefs);
  const nueva = !actual || datos.n !== actual.n;
  const visible = $tarjeta.classList.contains('visible');
  if (nueva) pdfs.clear();
  actual = datos;
  if (nueva && visible) {
    // Cambio de tarea con la tarjeta ya abierta: fundido corto y se desliza.
    $contenido.classList.add('entrando');
    pintar();
    setTimeout(() => $contenido.classList.remove('entrando'), 16);
    colocar({ animar: true });
    return;
  }
  pintar();
  if (visible) {
    colocar({ animar: true });
  } else if (!datos.cargando) {
    mostrarTarjeta();
  } else {
    // Primera vez: si el detalle llega enseguida (estaba precargado) se
    // muestra ya completo; si no, a los 140 ms con lo que haya.
    clearTimeout(esperaPrimera);
    esperaPrimera = setTimeout(mostrarTarjeta, 140);
  }
});

vista.alMuestra(({ n, i, muestra }) => {
  if (!actual || n !== actual.n || !actual.detalle) return;
  if (muestra) actual.detalle.archivos[i].muestra = muestra;
  else actual.detalle.archivos[i].sinMuestra = true;
  actualizarArchivo(i);
});

vista.alCerrar(() => {
  clearTimeout(esperaPrimera);
  $tarjeta.classList.add('quieta');
  $tarjeta.classList.remove('visible');
  actual = null;
  vista.raton(false);
});

// ---- Ratón ----

$tarjeta.addEventListener('mouseenter', () => {
  vista.raton(true);
  vista.mantener();
});
$tarjeta.addEventListener('mouseleave', () => {
  vista.raton(false);
  vista.soltar();
});
$tarjeta.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-archivo]');
  if (el && actual?.detalle) {
    // Se descarga con la sesión de la app (nunca pide volver a entrar) y
    // se abre con su programa. Sólo cambia su etiqueta, nada más se repinta.
    const i = Number(el.dataset.archivo);
    const a = actual.detalle.archivos[i];
    if (a.estadoDescarga === 'Abriendo…') return;
    const marcar = (texto) => {
      a.estadoDescarga = texto;
      const bajar = $contenido.querySelector(`[data-archivo="${i}"] .bajar`);
      if (bajar) bajar.innerHTML = htmlBajar(a);
    };
    marcar('Abriendo…');
    const r = await window.agenda.abrirArchivo({ url: a.url, nombre: a.nombre, curso: actual.curso });
    marcar(r?.error || 'Abierto');
    setTimeout(() => marcar(null), 4000);
    return;
  }
  const enlace = e.target.closest('[data-url]');
  if (enlace?.dataset.url) window.agenda.abrir(enlace.dataset.url);
});
</script>
</body>
</html>
