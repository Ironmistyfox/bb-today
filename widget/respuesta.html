<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; font-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Respuesta · BB Today</title>
<link rel="stylesheet" href="temas.css">
<link rel="stylesheet" href="../node_modules/katex/dist/katex.min.css">
<script src="../node_modules/katex/dist/katex.min.js"></script>
<script src="../node_modules/katex/dist/contrib/auto-render.min.js"></script>
<script src="markdown.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fondo-b); }
  body { color: var(--texto); font: 14px/1.6 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
  header { padding: 16px 20px 12px; border-bottom: 1px solid var(--linea); background: var(--fondo-a); }
  .curso { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--tenue); }
  h1 { margin: 2px 0 4px; font: 600 18px/1.3 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .cuando { font-size: 12px; color: var(--tenue); }
  .acciones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  button { font: inherit; font-size: 13px; font-weight: 600; border-radius: 8px; padding: 6px 12px; cursor: pointer; border: 1px solid var(--borde); color: var(--texto); background: var(--pieza); }
  button:hover { background: var(--pieza-hover); }
  button.primario { background: var(--acento); border-color: var(--acento); color: #fff; }
  button.peligro { color: var(--mal); margin-left: auto; }
  main { flex: 1; overflow-y: auto; padding: 18px 22px 40px; user-select: text; }
  main h1, main h2, main h3 { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; line-height: 1.3; margin: 18px 0 8px; }
  main h1 { font-size: 19px; } main h2 { font-size: 17px; } main h3 { font-size: 15px; }
  main p { margin: 8px 0; }
  main ul, main ol { margin: 8px 0; padding-left: 22px; }
  main li { margin: 3px 0; }
  main code { font: 12.5px "Cascadia Mono", Consolas, monospace; background: var(--pieza); border-radius: 4px; padding: 1px 5px; }
  main pre { background: var(--codigo); border: 1px solid var(--linea); border-radius: 8px; padding: 12px 14px; overflow-x: auto; }
  main pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.55; }
  main hr { border: 0; border-top: 1px solid var(--linea); margin: 18px 0; }
  main blockquote { margin: 8px 0; padding: 2px 12px; border-left: 3px solid var(--borde); color: var(--suave); }
  .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
  .imagenes { display: grid; gap: 14px; margin-bottom: 18px; }
  .imagenes figure { margin: 0; }
  .imagenes img { display: block; max-width: 100%; border-radius: 8px; border: 1px solid var(--linea); background: #fff; }
  .imagenes figcaption { display: flex; gap: 6px; margin-top: 6px; }
  .imagenes figcaption button { font-size: 12px; padding: 3px 9px; }
  .archivos { display: grid; gap: 8px; margin-bottom: 18px; }
  .archivo { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--borde); border-radius: 9px; background: var(--fondo-a); }
  .archivo .nombre { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .archivo button { font-size: 12px; padding: 3px 9px; }
  .vacio { color: var(--tenue); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="curso" id="curso"></div>
  <h1 id="titulo">Respuesta</h1>
  <div class="cuando" id="cuando"></div>
  <div class="acciones">
    <button class="primario" id="copiar">Copiar respuesta</button>
    <button id="imagen" hidden>Imagen con ChatGPT</button>
    <button id="carpeta" hidden>Abrir carpeta</button>
    <button id="descargar-todas" hidden>Descargar imágenes</button>
    <button id="blackboard">Abrir la tarea en Blackboard</button>
    <button class="peligro" id="borrar">Borrar</button>
  </div>
</header>
<main id="contenido"><div class="vacio">Cargando…</div></main>

<script>
// Ventana con la respuesta que dejó Claude para una tarea. Se lee como
// Markdown con fórmulas (KaTeX); «Copiar» copia el texto original.
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
let tareaId = new URLSearchParams(location.search).get('tarea');
let datos = null;

const oscuro = matchMedia('(prefers-color-scheme: dark)');
const aplicarTema = () => window.agenda.tema().then((t) => (document.documentElement.dataset.tema = t));
aplicarTema();
oscuro.addEventListener('change', aplicarTema);

const haceCuanto = (iso) => {
  const min = Math.round((Date.now() - Date.parse(iso)) / 60_000);
  if (min < 1) return 'hace un momento';
  if (min < 60) return `hace ${min} min`;
  return new Date(iso).toLocaleString('es-MX', { weekday: 'long', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
};

async function cargar() {
  aplicarTema();
  datos = await window.agenda.respuesta.obtener(tareaId);
  if (!datos) {
    $('titulo').textContent = 'Sin respuesta';
    $('contenido').innerHTML = '<div class="vacio">Esta tarea todavía no tiene respuesta de Claude.</div>';
    return;
  }
  document.title = `${datos.titulo} · Respuesta`;
  $('curso').textContent = datos.curso || '';
  $('titulo').textContent = datos.titulo;
  const quien = datos.ia === 'chatgpt' ? 'ChatGPT' : datos.ia || 'Claude';
  $('cuando').textContent = `Respuesta de ${quien} · ${haceCuanto(datos.cuando)}`;
  $('carpeta').hidden = !datos.carpeta;
  $('descargar-todas').hidden = (datos.imagenes || []).length < 2;
  const imagenes = (datos.imagenes || [])
    .map((u, i) => `<figure><img src="${esc(u)}" alt=""><figcaption><button class="primario" data-descargar-imagen="${i}">Descargar</button><button data-copiar-imagen="${i}">Copiar imagen</button></figcaption></figure>`)
    .join('');
  const archivos = (datos.archivos || [])
    .map((a, i) => `<div class="archivo"><span class="nombre">${esc(a.nombre)}</span><button class="primario" data-abrir-archivo="${i}">Abrir</button><button data-mostrar-archivo="${i}">Mostrar en carpeta</button></div>`)
    .join('');
  $('contenido').innerHTML = (imagenes ? `<div class="imagenes">${imagenes}</div>` : '') + (archivos ? `<div class="archivos">${archivos}</div>` : '') + formatoRespuesta.markdown(datos.texto || '');
  formatoRespuesta.formulas($('contenido'));
  $('imagen').hidden = !datos.imagenConChatGPT;
  $('copiar').hidden = !datos.texto && !(datos.imagenes || []).length;
  $('blackboard').hidden = !datos.enlace;
}

$('copiar').onclick = async () => {
  await window.agenda.respuesta.copiar(tareaId);
  $('copiar').textContent = 'Copiada';
  setTimeout(() => ($('copiar').textContent = 'Copiar respuesta'), 1600);
};
$('carpeta').onclick = () => window.agenda.respuesta.carpeta(tareaId);
$('descargar-todas').onclick = () => window.agenda.respuesta.descargarImagen(tareaId);
$('imagen').onclick = async () => {
  $('imagen').textContent = 'Abriendo ChatGPT…';
  await window.agenda.respuesta.imagen(tareaId);
  setTimeout(() => ($('imagen').textContent = 'Imagen con ChatGPT'), 2500);
};
$('contenido').addEventListener('click', (e) => {
  const copiar = e.target.closest('[data-copiar-imagen]');
  if (copiar) {
    window.agenda.respuesta.copiarImagen(tareaId, Number(copiar.dataset.copiarImagen));
    copiar.textContent = 'Copiada';
    setTimeout(() => (copiar.textContent = 'Copiar imagen'), 1600);
  }
  const abrirArchivo = e.target.closest('[data-abrir-archivo]');
  if (abrirArchivo) window.agenda.respuesta.abrirArchivo(tareaId, Number(abrirArchivo.dataset.abrirArchivo));
  const mostrarArchivo = e.target.closest('[data-mostrar-archivo]');
  if (mostrarArchivo) window.agenda.respuesta.mostrarArchivo(tareaId, Number(mostrarArchivo.dataset.mostrarArchivo));
  const bajar = e.target.closest('[data-descargar-imagen]');
  if (bajar) {
    window.agenda.respuesta.descargarImagen(tareaId, Number(bajar.dataset.descargarImagen));
    bajar.textContent = 'Descargada';
    setTimeout(() => (bajar.textContent = 'Descargar'), 1600);
  }
});
$('blackboard').onclick = () => datos?.enlace && window.agenda.abrir(datos.enlace);
$('borrar').onclick = async () => {
  await window.agenda.respuesta.borrar(tareaId);
  window.close();
};
window.agenda.respuesta.alMostrar((id) => {
  tareaId = id;
  cargar();
});
cargar();
</script>
</body>
</html>
